# The four flights of the paper. Paths are relative to the repository root; data/ is the Zenodo record (docs/02_data.md).
# DJI drone, nadir camera; 1920 x 1080 copies of the recorded videos. GNSS (.SRT) is for evaluation only.

fieldA:
  name: Field A
  role: development
  date: 2025-12-26
  description: full loop over the cabbage field, starting at row B
  video: data/videos/fieldA.mp4
  video_sha1: 6971fa9b0d659e122667533d0ddad927263eafaa
  weights: data/weights/cabbage.pt
  segments: ''
  srt: data/gnss/fieldA.SRT

fieldB:
  name: Field B
  role: development
  date: 2025-12-14
