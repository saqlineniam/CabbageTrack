<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabbage Ground Truth</title>
<style>
  :root { --bg:#f6f7f5; --card:#fff; --ink:#1d2320; --muted:#5f6b65; --line:#d9ded9;
          --ok:#1f8a4c; --bad:#c23b2e; --unsure:#a07400; --accent:#2457a6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  .tab { border:1px solid var(--line); background:#fff; padding:7px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=text] { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; width:160px; }
  .spacer { flex:1; }
  .btn { font:inherit; padding:9px 16px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .btn:hover { border-color:var(--ink); }
  main { max-width:1500px; margin:0 auto; padding:16px; }
  .help { color:var(--muted); margin:0 0 12px; }
  .progress { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin:6px 0 14px; }
  .progress > div { height:100%; background:var(--accent); width:0; }
  .pair { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .pair figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .pair figcaption { font-weight:600; margin-bottom:6px; }
  .pair img { width:340px; height:340px; display:block; border-radius:4px; }
  .answers { display:flex; gap:12px; justify-content:center; margin:18px 0 6px; flex-wrap:wrap; }
  .answers .btn { min-width:150px; font-weight:600; font-size:16px; }
  .ok { border-color:var(--ok); color:var(--ok); }  .ok.sel { background:var(--ok); color:#fff; }
  .bad { border-color:var(--bad); color:var(--bad); } .bad.sel { background:var(--bad); color:#fff; }
  .uns { border-color:var(--unsure); color:var(--unsure); } .uns.sel { background:var(--unsure); color:#fff; }
  .nav { display:flex; gap:10px; justify-content:center; color:var(--muted); align-items:center; }
  .blindwrap { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .blindwrap { flex-wrap:nowrap; }
  .blindwrap figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; flex:1 1 0; min-width:0; }
  canvas { display:block; width:100%; height:auto; border-radius:4px; cursor:crosshair; }
  @media (max-width:900px) { .blindwrap { flex-wrap:wrap; } .blindwrap figure { flex-basis:100%; } }
  .done { text-align:center; padding:40px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 5px; font-size:13px; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>Cabbage re-identification — human check</h1>
  <button class="tab" id="tabA">Part A · Verify pairs</button>
  <button class="tab" id="tabB">Part B · Blind find</button>
  <span class="spacer"></span>
  <label>Your name <input type="text" id="who" placeholder="annotator"></label>
  <button class="btn" id="export">Export results (CSV)</button>
</header>
<main id="main"></main>
<script src="tasks.js"></script>
<script>
const T = window.TASKS;
const KEY = 'cabbage_gt_' + ((T.meta && T.meta.tag) || 'v1');
let S = { who:'', tab:'A', iA:0, iB:0, A:{}, B:{} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const $ = id => document.getElementById(id);
$('who').value = S.who || '';
$('who').oninput = e => { S.who = e.target.value; save(); };
$('tabA').onclick = () => { S.tab = 'A'; save(); render(); };
$('tabB').onclick = () => { S.tab = 'B'; save(); render(); };
let shownAt = Date.now();

function render() {
  $('tabA').classList.toggle('on', S.tab === 'A');
  $('tabB').classList.toggle('on', S.tab === 'B');
  shownAt = Date.now();
  S.tab === 'A' ? renderA() : renderB();
}

/* ---------------- Part A ---------------- */
function renderA() {
  const L = T.verify, n = Object.keys(S.A).length;
  const m = $('main');
  if (S.iA >= L.length) {
    m.innerHTML = `<div class="done"><h2>Part A finished — ${n} of ${L.length} answered.</h2>
      <p>Click <b>Export results</b> at the top, then continue with Part B.</p>
      <button class="btn" onclick="reviewA()">Review Part A from the start</button>
      <button class="btn" onclick="goB()">Go to Part B →</button></div>`;
    return;
  }
  const t = L[S.iA], a = S.A[t.id] && S.A[t.id].answer;
  m.innerHTML = `
    <p class="help">Is the plant in the middle of the <b>left</b> picture the <b>same physical plant</b> as the one in the middle of the <b>right</b> picture?
    The yellow ticks point at the plant. Use leaves, gaps, weeds and soil cracks around it. Keys: <kbd>1</kbd> same · <kbd>2</kbd> different · <kbd>3</kbd> unsure · <kbd>←</kbd> back</p>
    <div class="progress"><div style="width:${100*n/L.length}%"></div></div>
    <div class="pair">
      <figure><figcaption>Later pass</figcaption><img src="img/${t.back}" alt=""></figure>
      <figure><figcaption>Earlier pass</figcaption><img src="img/${t.out}" alt=""></figure>
    </div>
    <div class="answers">
      <button class="btn ok ${a==='same'?'sel':''}" onclick="answerA('same')">1 · Same plant</button>
      <button class="btn bad ${a==='different'?'sel':''}" onclick="answerA('different')">2 · Different plant</button>
      <button class="btn uns ${a==='unsure'?'sel':''}" onclick="answerA('unsure')">3 · Unsure</button>
    </div>
    <div class="nav"><button class="btn" onclick="moveA(-1)">← Back</button>
      <span>${S.iA+1} / ${L.length} · answered ${n}</span>
      <button class="btn" onclick="moveA(1)">Skip →</button></div>`;
}
function answerA(v) {
  const t = T.verify[S.iA];
  S.A[t.id] = { answer:v, seconds:Math.round((Date.now()-shownAt)/100)/10, at:new Date().toISOString() };
  S.iA++; save(); render();
}
function reviewA() { S.tab = 'A'; S.iA = 0; save(); render(); window.scrollTo(0, 0); }
function goB() { S.tab = 'B'; save(); render(); window.scrollTo(0, 0); }
function reviewB() { S.tab = 'B'; S.iB = 0; save(); render(); window.scrollTo(0, 0); }
function moveA(d) { S.iA = Math.max(0, Math.min(T.verify.length, S.iA + d)); save(); render(); }

/* ---------------- Part B ---------------- */
let selB = null;
function renderB() {
  const L = T.blind, n = Object.keys(S.B).length, m = $('main');
  if (S.iB >= L.length) {
    m.innerHTML = `<div class="done"><h2>Part B finished — ${n} of ${L.length} answered.</h2>
      <p>Click <b>Export results</b> at the top and send the CSV file back.</p>
      <button class="btn" onclick="reviewB()">Review Part B from the start</button></div>`;
    return;
  }
  const t = L[S.iB], prev = S.B[t.id];
  selB = prev ? prev.raw_id : null;
  m.innerHTML = `
    <p class="help">The <b>red circle</b> on the left marks one plant on an earlier pass. Find the <b>same plant</b> in the later-pass photo on the right and <b>click it</b>
    (every detected plant has a thin white ring). Then press <kbd>Enter</kbd> or Confirm. If you cannot find it, choose “Not visible / can't tell”.</p>
    <div class="progress"><div style="width:${100*n/L.length}%"></div></div>
    <div class="blindwrap">
      <figure><figcaption>Earlier pass — plant to find</figcaption><canvas id="cOut"></canvas></figure>
      <figure><figcaption>Later pass — click the same plant</figcaption><canvas id="cBack"></canvas></figure>
    </div>
    <div class="answers">
      <button class="btn ok" onclick="confirmB()">Confirm selection</button>
      <button class="btn uns" onclick="noneB()">Not visible / can't tell</button>
    </div>
    <div class="nav"><button class="btn" onclick="moveB(-1)">← Back</button>
      <span>${S.iB+1} / ${L.length} · answered ${n}</span>
      <button class="btn" onclick="moveB(1)">Skip →</button></div>`;
  drawImg('cOut', 'img/' + t.out, ctx => {
    ctx.lineWidth = 4; ctx.strokeStyle = '#ff2a2a';
    ctx.beginPath(); ctx.arc(t.target[0], t.target[1], 34, 0, 7); ctx.stroke();
  });
  drawBack();
  $('cBack').onclick = ev => {
    const c = $('cBack'), r = c.getBoundingClientRect();
    const x = (ev.clientX - r.left) * c.width / r.width, y = (ev.clientY - r.top) * c.height / r.height;
    let best = null, bd = 45;
    for (const d of t.dets) { const dd = Math.hypot(d[0]-x, d[1]-y); if (dd < bd) { bd = dd; best = d[2]; } }
    selB = best; drawBack();
  };
}
function drawImg(id, src, after) {
  const c = $(id), img = new Image();
  img.onload = () => { c.width = img.width; c.height = img.height; const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0); after && after(ctx); };
  img.src = src;
}
function drawBack() {
  const t = T.blind[S.iB];
  drawImg('cBack', 'img/' + t.back, ctx => {
    for (const d of t.dets) {
      const on = d[2] === selB;
      ctx.lineWidth = on ? 5 : 1.5; ctx.strokeStyle = on ? '#ffd400' : 'rgba(255,255,255,0.75)';
      ctx.beginPath(); ctx.arc(d[0], d[1], on ? 34 : 26, 0, 7); ctx.stroke();
    }
  });
}
function confirmB() {
  if (selB === null) { alert('Click a plant in the later-pass photo first (or choose "Not visible").'); return; }
  const t = T.blind[S.iB];
  S.B[t.id] = { raw_id:selB, seconds:Math.round((Date.now()-shownAt)/100)/10, at:new Date().toISOString() };
  S.iB++; save(); render();
}
function noneB() {
  const t = T.blind[S.iB];
  S.B[t.id] = { raw_id:null, seconds:Math.round((Date.now()-shownAt)/100)/10, at:new Date().toISOString() };
  S.iB++; save(); render();
}
function moveB(d) { S.iB = Math.max(0, Math.min(T.blind.length, S.iB + d)); save(); render(); }

/* ---------------- keys + export ---------------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (S.tab === 'A') {
    if (e.key === '1') answerA('same'); else if (e.key === '2') answerA('different');
    else if (e.key === '3') answerA('unsure'); else if (e.key === 'ArrowLeft') moveA(-1);
  } else {
    if (e.key === 'Enter') confirmB(); else if (e.key === 'ArrowLeft') moveB(-1);
  }
});
$('export').onclick = () => {
  const rows = [['annotator','part','task_id','gid','decoy','decoy_gid','answer','clicked_raw_id','out_frame','back_frame','seconds','answered_at']];
  for (const t of T.verify) { const a = S.A[t.id]; if (a) rows.push([S.who,'A',t.id,t.gid,t.decoy,t.decoy_gid??'',a.answer,'','','',a.seconds,a.at]); }
  for (const t of T.blind) { const a = S.B[t.id]; if (a) rows.push([S.who,'B',t.id,t.gid,'','',a.raw_id===null?'not_visible':'clicked',a.raw_id??'',t.out_frame,t.back_frame,a.seconds,a.at]); }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'}), url = URL.createObjectURL(blob), el = document.createElement('a');
  el.href = url; el.download = `gt_results_${(T.meta && T.meta.tag) || 'v1'}_${(S.who||'annotator').replace(/\W+/g,'_')}.csv`; el.click(); URL.revokeObjectURL(url);
};
if (!T.verify.length) { S.tab = 'B'; $('tabA').style.display = 'none'; }
if (!T.blind.length) { S.tab = 'A'; $('tabB').style.display = 'none'; }
render();
</script>
</body>
</html>
